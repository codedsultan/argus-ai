name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check domain services evals scripts deploy

      - name: Tests
        # Integration tests skip when the core stack is not running.
        run: python -m pytest evals -q

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/public/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            ARGUS_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ghcr.io/codedsultan/argus-ai:${{ steps.meta.outputs.tag }}
            ghcr.io/codedsultan/argus-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INFRA_REPO: ${{ vars.INFRA_REPO }}
      INFRA_REPO_PAT: ${{ secrets.INFRA_REPO_PAT }}
    steps:
      - name: Require INFRA_REPO
        if: env.INFRA_REPO_PAT != ''
        run: |
          if [ -z "$INFRA_REPO" ]; then
            echo "::error::Set the INFRA_REPO repository variable."
            exit 1
          fi

      - name: Dispatch to infrastructure
        if: env.INFRA_REPO_PAT != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ env.INFRA_REPO_PAT }}
          repository: ${{ env.INFRA_REPO }}
          event-type: deploy-app
          client-payload: |
            {
              "app_name": "argus_ai",
              "environment": "staging",
              "tag": "${{ needs.image.outputs.tag }}",
              "commit_sha": "${{ github.sha }}",
              "commit_message": ${{ toJSON(github.event.head_commit.message || '') }},
              "triggered_by": "${{ github.actor }}",
              "repo": "${{ github.repository }}",
              "run_id": "${{ github.run_id }}"
            }

      - name: Deployment skipped
        if: env.INFRA_REPO_PAT == ''
        run: |
          echo "::notice::INFRA_REPO_PAT is not set. Trigger the infrastructure deploy manually with tag ${{ needs.image.outputs.tag }}."
