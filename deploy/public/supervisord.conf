[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
user=root

[program:jaeger]
command=/usr/local/bin/jaeger-all-in-one --query.base-path=/jaeger --collector.otlp.enabled=true --collector.otlp.grpc.host-port=:4317 --collector.otlp.http.host-port=:4319
priority=10
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:collector]
command=/usr/local/bin/otelcol-contrib --config=/app/deploy/public/collector.yaml
priority=20
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:shop-api]
command=python -m uvicorn domain.shop_api.app:app --host 127.0.0.1 --port 8081
directory=/app
priority=30
autorestart=true
startsecs=2
environment=PYTHONPATH="/app",OTEL_ENABLED="true",OTEL_EXPORTER_OTLP_ENDPOINT="http://127.0.0.1:4318",OTEL_METRICS_EXPORTER="none",OTEL_SERVICE_NAME="shop-api"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:agent]
command=python -m uvicorn services.agent.main:app --host 127.0.0.1 --port 8010
directory=/app
priority=40
autorestart=true
startsecs=3
environment=PYTHONPATH="/app",APPLICATION_ENDPOINT="127.0.0.1:8081",USE_VCR="true",VCR_RECORD_MODE="none",VCR_CASSETTE_DIR="/app/evals/cassettes",PUBLIC_MODE="true",LLM_MODEL="azure/gpt-5.5",HISTORY_MAX_TOKENS="8000",HISTORY_MIN_RECENT="2",GRAPH_RECURSION_LIMIT="25",OTEL_ENABLED="true",OTEL_EXPORTER_OTLP_ENDPOINT="http://127.0.0.1:4318",OTEL_EXPORTER_OTLP_INSECURE="true",OTEL_METRICS_EXPORTER="none",OTEL_SERVICE_NAME="agent",TRACELOOP_BASE_URL="http://127.0.0.1:4318",TRACELOOP_METRICS_ENABLED="false",TRACELOOP_TELEMETRY="false",TRACELOOP_TRACE_CONTENT="false"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:proxy]
command=/bin/sh -c "python -m uvicorn deploy.public.proxy:app --host 0.0.0.0 --port ${PORT:-8080}"
directory=/app
priority=50
autorestart=true
startsecs=2
environment=PYTHONPATH="/app",AGENT_INTERNAL_URL="http://127.0.0.1:8010",JAEGER_INTERNAL_URL="http://127.0.0.1:16686",PUBLIC_BFF_TOKEN="%(ENV_PUBLIC_BFF_TOKEN)s",PUBLIC_RATE_LIMIT_PER_MINUTE="%(ENV_PUBLIC_RATE_LIMIT_PER_MINUTE)s",PUBLIC_MAX_CONCURRENT="%(ENV_PUBLIC_MAX_CONCURRENT)s",MAX_PROMPT_BYTES="%(ENV_MAX_PROMPT_BYTES)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
